# MD5 and SHA-1 constants, derived by tools/derive_constants.py.
# Do not hand-edit: run `python -m tools.derive_constants` instead.
#
# Both algorithms are broken classically rather than by quantum search, so
# nist_quantum_level is deliberately unset: a number in that field would
# misreport what the field means. They are still worth detecting - a migration
# planner wants to know they are there.
#
# SHA-1's IV and MD5's are the same four words, which is a historical artefact
# of MD4's lineage rather than a coincidence. SHA-1 adds a fifth, so the
# combined five-word run is what distinguishes them.

[[signature]]
id = "md5-t-table"
family = "MD5"
algorithm = "MD5"
primitive = "hash"
class = "word-table"
description = "T[i] = floor(|sin(i)| * 2^32), RFC 1321 3.4"
words = ["d76aa478", "e8c7b756", "242070db", "c1bdceee", "f57c0faf", "4787c62a", "a8304613", "fd469501", "698098d8", "8b44f7af", "ffff5bb1", "895cd7be", "6b901122", "fd987193", "a679438e", "49b40821", "f61e2562", "c040b340", "265e5a51", "e9b6c7aa", "d62f105d", "02441453", "d8a1e681", "e7d3fbc8", "21e1cde6", "c33707d6", "f4d50d87", "455a14ed", "a9e3e905", "fcefa3f8", "676f02d9", "8d2a4c8a", "fffa3942", "8771f681", "6d9d6122", "fde5380c", "a4beea44", "4bdecfa9", "f6bb4b60", "bebfbc70", "289b7ec6", "eaa127fa", "d4ef3085", "04881d05", "d9d4d039", "e6db99e5", "1fa27cf8", "c4ac5665", "f4292244", "432aff97", "ab9423a7", "fc93a039", "655b59c3", "8f0ccc92", "ffeff47d", "85845dd1", "6fa87e4f", "fe2ce6e0", "a3014314", "4e0811a1", "f7537e82", "bd3af235", "2ad7d2bb", "eb86d391"]
word_size = 4
layouts = ["le-contiguous", "be-contiguous"]
min_match = 64

[[signature]]
id = "sha1-iv"
family = "SHA-1"
algorithm = "SHA-1"
primitive = "hash"
class = "word-table"
description = "Initial hash value, FIPS 180-4 5.3.1. Five words including MD4's four"
words = ["67452301", "efcdab89", "98badcfe", "10325476", "c3d2e1f0"]
word_size = 4
layouts = ["le-contiguous", "be-contiguous"]
