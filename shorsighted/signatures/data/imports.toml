# ---------------------------------------------------------------------------
# OpenSSL — specific algorithms
#
# The DLL glob is wide on purpose: OpenSSL ships as libcrypto-3-x64.dll,
# libcrypto-1_1.dll, libeay32.dll, and vendor-renamed variants. Note that a
# *statically* linked OpenSSL imports none of this and is invisible here —
# catching that case is the constant detector's job (D-6), and the reason it is
# treated as core rather than as a fallback.
# ---------------------------------------------------------------------------

[[signature]]
id          = "openssl-aes"
class       = "import-specific"
dll         = "libcrypto*.dll"
family      = "AES"
algorithm   = "AES"
primitive   = "block-cipher"
nist_quantum_level = 1
description = "Key size is not knowable from the symbol alone; level is the AES-128 floor."
symbols = [
    "AES_encrypt",
    "AES_decrypt",
    "AES_set_encrypt_key",
    "AES_set_decrypt_key",
    "AES_cbc_encrypt",
    "EVP_aes_128_cbc",
    "EVP_aes_192_cbc",
    "EVP_aes_256_cbc",
    "EVP_aes_128_gcm",
    "EVP_aes_256_gcm",
]

[[signature]]
id          = "openssl-sha2"
class       = "import-specific"
dll         = "libcrypto*.dll"
family      = "SHA-2"
algorithm   = "SHA-2"
primitive   = "hash"
nist_quantum_level = 2
symbols = [
    "SHA256_Init",
    "SHA256_Update",
    "SHA256_Final",
    "SHA512_Init",
    "SHA512_Update",
    "EVP_sha256",
    "EVP_sha384",
    "EVP_sha512",
]

[[signature]]
id          = "openssl-sha1"
class       = "import-specific"
dll         = "libcrypto*.dll"
family      = "SHA-1"
algorithm   = "SHA-1"
primitive   = "hash"
description = "Collision-broken classically. No quantum category applies."
symbols = ["SHA1_Init", "SHA1_Update", "SHA1_Final", "EVP_sha1"]

[[signature]]
id          = "openssl-md5"
class       = "import-specific"
