# ---------------------------------------------------------------------------
# CNG algorithm identifiers, as UTF-16LE literals (design §4)
#
# Every value below is a BCRYPT_*_ALGORITHM identifier from bcrypt.h. Matching
# includes the wide-string null terminator, which is what stops "SHA1" from
# firing inside "SHA1_SOMETHING" and keeps a three-letter value like "AES" from
# being a coin flip.
# ---------------------------------------------------------------------------

[[string]]
id          = "cng-alg-aes"
class       = "utf16-string"
value       = "AES"
requires    = ["cng"]
family      = "AES"
algorithm   = "AES"
primitive   = "block-cipher"
nist_quantum_level = 1
description = "BCRYPT_AES_ALGORITHM. Key size is set at runtime, so the level is the floor."

[[string]]
id          = "cng-alg-rsa"
class       = "utf16-string"
value       = "RSA"
requires    = ["cng"]
family      = "RSA"
algorithm   = "RSA"
primitive   = "pke"
nist_quantum_level = 0

[[string]]
