# Import-table signatures (FR-6) and the UTF-16 strings that disambiguate them.
#
# Two kinds of entry live here:
#
#   [[signature]]  a DLL + symbol rule. Matching any one symbol is a hit.
#   [[string]]     a UTF-16LE literal, reportable only when a provider it
#                  requires is also present in the same file.
#
# The second kind exists because of a Windows-specific problem. CNG takes its
# algorithm as a runtime wide string, so `BCryptEncrypt` proves the binary does
# *some* cryptography and nothing more. The algorithm name is still in the
# file — as `L"AES"`, from bcrypt.h's BCRYPT_AES_ALGORITHM — so pairing the
# generic import with the string is what turns "uses CNG" into "uses AES".
#
# On nist_quantum_level (FR-14), which is a NIST PQC *category*, not a general
# "how bad is this" score:
#   0        quantum-broken public-key: RSA, ECC, DH, DSA
#   1/3/5    as hard as AES-128 / AES-192 / AES-256 key search
#   2/4      as hard as SHA-256 / SHA-384 collision search
# Where an import proves the family but not the key size — which is the usual
# case — the level is the conservative floor for that family. Algorithms whose
# weakness is classical rather than quantum (MD5, SHA-1, DES, RC4) leave the
# field unset: they are broken, but not in the way this field measures, and
# putting a number there would misreport what it means.

# ---------------------------------------------------------------------------
# Windows CNG — generic providers
# ---------------------------------------------------------------------------

[[signature]]
id          = "cng-bcrypt"
class       = "import-generic"
dll         = "bcrypt.dll"
provides    = "cng"
family      = "CNG"
description = "Cryptography API: Next Generation. Proves CNG use, not an algorithm."
symbols = [
    "BCryptOpenAlgorithmProvider",
    "BCryptEncrypt",
    "BCryptDecrypt",
    "BCryptCreateHash",
    "BCryptHashData",
    "BCryptFinishHash",
    "BCryptGenerateKeyPair",
    "BCryptGenerateSymmetricKey",
    "BCryptImportKeyPair",
    "BCryptExportKey",
    "BCryptSignHash",
    "BCryptVerifySignature",
    "BCryptSecretAgreement",
    "BCryptDeriveKey",
    "BCryptGenRandom",
]

[[signature]]
id          = "cng-ncrypt"
class       = "import-generic"
dll         = "ncrypt.dll"
provides    = "cng"
family      = "CNG"
description = "CNG key storage layer. Persisted keys, smartcards, TPM-backed keys."
symbols = [
    "NCryptOpenStorageProvider",
    "NCryptOpenKey",
    "NCryptCreatePersistedKey",
    "NCryptEncrypt",
    "NCryptDecrypt",
    "NCryptSignHash",
    "NCryptVerifySignature",
    "NCryptImportKey",
    "NCryptExportKey",
    "NCryptSecretAgreement",
]

