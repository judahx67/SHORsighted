# SM4 (GM/T 0002-2012), the AC-6 contributor fixture.
#
# NOT SHIPPED. This file is dropped into a copy of the real signature directory
# by `tests/test_signatures.py` to prove FR-9's promise end to end: a new
# algorithm arrives as data, and the scanner reports it with no Python changed.
# SM4 does not ship for real because a shipped signature needs a corpus sample
# and a recalibration pass (CLAUDE.md), and this test has neither.
#
# The S-box is transcribed rather than derived - it has no generating rule, the
# same reason DES is absent from `tools/derive_constants.py`. It was checked by
# encrypting the standard test vector from the standard's appendix A.1 with it
# before this file was written.

[[signature]]
id = "sm4-sbox"
family = "SM4"
algorithm = "SM4"
primitive = "block-cipher"
nist_quantum_level = 1
class = "unique-table"
description = "SM4 S-box, GM/T 0002-2012 section 6.2"
pattern = ""
min_match = 64
