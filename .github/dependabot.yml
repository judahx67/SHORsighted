version: 2

updates:
  # Actions are pinned to commit SHAs, which is only safe if something keeps
  # them current. Dependabot understands the `# v7` comment beside a pin and
  # updates both the SHA and the comment together.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: "ci"

  # Dev tooling only. The runtime dependency budget is `pefile` alone and
  # widening it is an escalation, not a pull request, so a bump to anything in
  # `dependencies` should be read as a question rather than merged.
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: "chore"
