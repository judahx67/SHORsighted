name: Evaluation

# The corpus build and the AC-7 evaluation. Deliberately not on every PR: it
# needs a C toolchain and produces a report that is committed rather than
# consumed by a gate.
#
# Two things it does gate:
#   - the eval must run clean (a corpus that no longer builds is a broken claim)
#   - confidence.toml must agree with what the corpus measures, so a signature
#     change cannot quietly invalidate every number the tool prints
#
# The report is uploaded as an artifact so a signature PR can be checked against
# real numbers before it lands.

# ponytail: no tag trigger here. A `push` block cannot filter tags and branches
# separately, and a paths filter on a tag push does not do what it looks like.
# Slice 11's release.yml calls this workflow instead.
on:
  schedule:
    - cron: "30 3 * * 1"
  workflow_dispatch:
  workflow_call:
  push:
    branches: [main]
    paths:
      - "shorsighted/signatures/**"
      - "shorsighted/detectors/**"
      - "corpus/**"
      - "eval/**"
      - ".github/workflows/eval.yml"
  pull_request:
    paths:
      - "shorsighted/signatures/**"
      - "shorsighted/detectors/**"
      - "corpus/**"
      - "eval/**"
      - ".github/workflows/eval.yml"

jobs:
  evaluate:
    name: Corpus + eval
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      # Fetched directly rather than through a setup action. The corpus is the
      # evidence behind every number this project publishes, so the toolchain
      # that builds it is pinned to an exact version and verified against the
      # checksum ziglang.org publishes - one fewer third-party action in the
      # supply chain of a security tool, for four lines.
      - name: Install Zig
        env:
          ZIG_VERSION: 0.16.0
          ZIG_SHA256: 70e49664a74374b48b51e6f3fdfbf437f6395d42509050588bd49abe52ba3d00
        working-directory: ${{ runner.temp }}
        run: |
          tarball="zig-x86_64-linux-${ZIG_VERSION}.tar.xz"
          curl -fsSL -O "https://ziglang.org/download/${ZIG_VERSION}/${tarball}"
          echo "${ZIG_SHA256}  ${tarball}" | sha256sum --check --strict
          tar -xf "$tarball"
          echo "$PWD/zig-x86_64-linux-${ZIG_VERSION}" >> "$GITHUB_PATH"

      - name: Install
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"

      - name: Build the corpus
        run: python -m corpus.build

      - name: Evaluate and check calibration
        run: python -m eval.run --check --out eval/report.md

      - name: Show the report
        run: cat eval/report.md >> "$GITHUB_STEP_SUMMARY"

      - name: Fail if the committed report is stale
        run: |
          if ! git diff --quiet -- eval/report.md; then
            echo "::error::eval/report.md is out of date. Run 'python -m eval.run' and commit it."
            git diff -- eval/report.md
            exit 1
          fi

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: eval-report
          path: eval/report.md
